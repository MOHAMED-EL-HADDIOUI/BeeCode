[package]
license = "Apache-2.0"
name = "wimo ai-wimo-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
wimo ai-wimo-hooks = { path = "../wimo ai-wimo-hooks" }
wimo ai-wimo-sampling-types = { path = "../wimo ai-wimo-sampling-types" }
wimo ai-wimo-tools = { path = "../wimo ai-wimo-tools" }
wimo ai-tty-utils = { workspace = true }
wimo ai-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
wimo ai-wimo-config = { workspace = true }
wimo ai-dirs = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
wimo ai-tool-types.workspace = true

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
