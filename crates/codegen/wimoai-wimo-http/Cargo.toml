[package]
license = "Apache-2.0"
name = "wimoai-wimo-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the wimo CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
reqwest-middleware = { workspace = true }
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
wimoai-wimo-auth = { workspace = true, features = ["middleware"] }
wimoai-wimo-extra-ca = { workspace = true }
wimoai-wimo-sampler = { path = "../wimoai-wimo-sampler" }
wimoai-wimo-telemetry = { workspace = true }
wimoai-wimo-version = { workspace = true }
wimoai-wimo-workspace = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
