[package]
license = "Apache-2.0"
name = "wimo ai-wimo-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the wimo CLI, extracted from wimo ai-wimo-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
wimo ai-wimo-announcements = { workspace = true }
wimo ai-wimo-config = { workspace = true }
wimo ai-wimo-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
