[package]
license = "Apache-2.0"
name = "beecode-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the BeeCode sampling / chat-completion API layer"

[dependencies]
async-openai = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
beecode-circuit-breaker = { workspace = true }
beecode-compaction = { path = "../../common/beecode-compaction" }
beecode-tools = { path = "../beecode-tools" }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
