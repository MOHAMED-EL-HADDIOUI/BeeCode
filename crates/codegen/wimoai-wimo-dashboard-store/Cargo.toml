[package]
license = "Apache-2.0"
name = "wimoai-wimo-dashboard-store"
version = "0.1.0"
edition.workspace = true
description = "SQLite-backed persistent dashboard workspace: membership, layout ranks, grouping"

[dependencies]
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2).
# Keep in step with wimoai-sqlite-journal (CVE-2025-29087/-3277/-6965 floor).
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = { workspace = true }
tracing = { workspace = true }
wimoai-wimo-config = { workspace = true }
wimoai-sqlite-journal = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
