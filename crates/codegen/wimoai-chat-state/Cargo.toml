[package]
license = "Apache-2.0"
name = "wimo ai-chat-state"
version = "0.1.0"
edition.workspace = true
description = "Actor-based chat state management for wimo AI agents"

[features]
default-bazel = []

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `CompactionDetail`, embedded in `CompactionMode::Segments`.
wimo ai-compaction-transcript = { workspace = true }
wimo ai-wimo-compaction = { path = "../../common/wimo ai-wimo-compaction" }
wimo ai-wimo-sampling-types = { path = "../wimo ai-wimo-sampling-types" }
wimo ai-token-estimation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
