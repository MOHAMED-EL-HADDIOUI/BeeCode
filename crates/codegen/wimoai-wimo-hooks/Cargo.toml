[package]
license = "Apache-2.0"
name = "wimoai-wimo-hooks"
version = "0.1.0"
edition.workspace = true
description = "Runtime hook system for wimo — file-based discovery, command execution, and policy enforcement"

[dependencies]
fastrand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
wimoai-wimo-extra-ca = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shellexpand = "3.1"
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
wimoai-wimo-config = { workspace = true }
# Child-network restriction on hook command spawns; enforce is feature-unified
# from the binary crate, matching the other consumers.
wimoai-wimo-sandbox = { path = "../wimoai-wimo-sandbox", default-features = false }
wimoai-wimo-tools = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true