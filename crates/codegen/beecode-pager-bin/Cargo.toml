[package]
name = "beecode-pager-bin"
version = "1.0.16"
edition.workspace = true
license = "Apache-2.0"
authors = ["BeeCode"]
default-run = "bee"

# Composition-root binary for the BeeCode Build TUI. Artifacts: `bee`
# (preferred short command), `beecode` and `beecode-pager` (long forms).
# This package exists so the binary can link both the pager
# library and the optional `beecode-pager-minimal` render mode: `minimal`
# depends on `beecode-pager`, so the pager library cannot depend back on it
# (cargo cycle). The binary installs the minimal-mode IoC hooks at startup.
# All three bins share `src/main.rs` (cargo warns about shared path; harmless).
[[bin]]
name = "beecode-pager"
path = "src/main.rs"

# Preferred short BeeCode command.
[[bin]]
name = "bee"
path = "src/main.rs"

# Full product name, so bare `beecode` works after install.
[[bin]]
name = "beecode"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
beecode-pager = { path = "../beecode-pager" }
# Optional scrollback-native render mode, wired in via the fn-pointer seam.
beecode-pager-minimal = { path = "../beecode-pager-minimal" }

# Agent runtime + leader/stdio/headless entry points.
beecode-shell = { workspace = true }
beecode-update = { path = "../beecode-update" }
beecode-version = { workspace = true }
beecode-telemetry = { workspace = true }
beecode-workspace = { workspace = true }
beecode-crash-handler = { path = "../beecode-crash-handler" }
beecode-acp-lib = { workspace = true }

# Async runtime + misc.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
semver = { workspace = true }
beecode-tty-utils = { workspace = true }
# `collect_crashed()` for the startup crash notice.
beecode-active-sessions = { workspace = true }
beecode-config = { workspace = true }
beecode-sandbox = { path = "../beecode-sandbox", default-features = false }
beecode-extra-ca = { workspace = true }

# Binary hardening: compile-time string + control-flow obfuscation.
obfstr = { workspace = true }
cryptify = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
tikv-jemallocator = { workspace = true, optional = true, features = ["stats"] }
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = { workspace = true, optional = true }
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = { workspace = true, optional = true, features = ["stats", "use_std"] }

[dev-dependencies]
serial_test = { workspace = true }
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }

[features]
default = [
    "jemalloc",
    "sandbox-enforce",
    ]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    "local-workspace",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
# beecode-workspace no longer enables sandbox-enforce by default, so enable it here.
sandbox-enforce = ["beecode-pager/sandbox-enforce", "beecode-workspace/sandbox-enforce"]
local-workspace = ["beecode-pager/local-workspace"]
release-dist = [
    "beecode-pager/release-dist",
    ]
