[package]
license = "Apache-2.0"
name = "wimoai-wimo-subagent-resolution"
version = "0.1.0"
edition.workspace = true
description = "Shared subagent definition, runtime, prompt, and resume resolution"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wimoai-wimo-agent = { path = "../wimoai-wimo-agent" }
wimoai-wimo-sampling-types = { path = "../wimoai-wimo-sampling-types" }
wimoai-wimo-tools = { path = "../wimoai-wimo-tools" }
wimoai-tool-types.workspace = true

[features]
default = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
toml = { workspace = true }

[lints]
workspace = true
